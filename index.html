<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechanical Memory Drum Simulator</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #1a1a24;
            margin: 0;
            padding: 30px 10px;
            box-sizing: border-box;
            color: #333;
        }

        /* Improved Top Heading */
        .experiment-title {
            color: #e3b881; 
            font-family: 'Georgia', serif;
            font-size: clamp(20px, 5vw, 28px);
            font-weight: normal;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 25px;
            text-shadow: 0px 2px 8px rgba(0,0,0,0.8);
            text-align: center;
            max-width: 90%;
        }

        /* The Wooden Base */
        .wooden-base {
            background: linear-gradient(to right, #c79a63, #e3b881, #c79a63);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0px 15px 35px rgba(0,0,0,0.8), inset 0px 2px 4px rgba(255,255,255,0.4);
            border-bottom: 6px solid #8b5a2b;
            border-right: 4px solid #8b5a2b;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }

        /* The Metallic Drum Housing */
        .drum-housing {
            background: linear-gradient(135deg, #a4acb3, #8a939a);
            position: relative;
            padding: 20px 15px;
            border-radius: 5px;
            box-shadow: inset 2px 2px 5px rgba(255,255,255,0.7), inset -3px -3px 10px rgba(0,0,0,0.5);
            border: 1px solid #666;
            width: 100%;
            box-sizing: border-box;
        }

        /* Simulates the slanted front face */
        .slanted-front {
            background: linear-gradient(to bottom, #9ca4ab, #7a8289);
            padding: 15px;
            border-radius: 4px;
            box-shadow: inset 0px 5px 15px rgba(255,255,255,0.3), 0px 10px 15px rgba(0,0,0,0.4);
            border: 1px solid #555;
            position: relative;
            box-sizing: border-box;
        }

        /* The Continuous Hinge for the flaps */
        .hinge-bar {
            width: 100%;
            height: 8px;
            background: linear-gradient(to bottom, #bbb, #555);
            border-radius: 4px;
            margin-bottom: -4px;
            position: relative;
            z-index: 20;
            box-shadow: 0px 2px 4px rgba(0,0,0,0.5);
        }

        /* The Aperture / Paper Strip Window */
        .aperture-window {
            background-color: #111;
            border-radius: 2px;
            box-shadow: inset 0px 10px 20px rgba(0,0,0,0.9);
            position: relative;
            height: clamp(60px, 15vw, 80px);
            border: 2px solid #444;
        }

        .paper-strip {
            display: flex;
            background-color: #f4eedc;
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            box-shadow: inset 0px 0px 15px rgba(0,0,0,0.3);
        }

        .syllable-slot {
            width: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(20px, 7vw, 34px);
            font-weight: 900;
            color: #222;
            letter-spacing: 2px;
        }

        .divider {
            width: 2px;
            background-color: #999;
            height: 80%;
            margin-top: 1%;
        }

        /* The 6 Individual Flaps */
        .flaps-container {
            display: flex;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 102%;
            z-index: 10;
        }

        .flap {
            flex: 1;
            background: linear-gradient(to bottom, #b4bcc3, #8a939a);
            border-right: 1px solid #666;
            border-left: 1px solid #ccc;
            border-bottom: 3px solid #555;
            box-shadow: 1px 2px 5px rgba(0,0,0,0.4);
            transform-origin: top;
            transition: transform 0.15s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        .flap:last-child {
            border-right: none;
        }

        .flap.open {
            transform: rotateX(95deg);
            box-shadow: none;
        }

        .flap.closed {
            transform: rotateX(0deg);
        }

        /* Controls */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            flex: 1 1 45%;
            min-width: 130px;
            padding: 12px 10px;
            font-size: clamp(10px, 3vw, 13px);
            font-weight: bold;
            font-family: Arial, sans-serif;
            cursor: pointer;
            border: 2px solid #333;
            border-radius: 4px;
            background: linear-gradient(to bottom, #e0e5e9, #9ba3a9);
            color: #111;
            text-transform: uppercase;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.3);
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0px 1px 2px rgba(0,0,0,0.3);
        }

        /* Footer Container */
        .footer-panel {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            padding: 0 10px;
        }

        /* Timer Display */
        .led-display {
            background-color: #0a0a0a;
            color: #ff3333;
            font-family: 'Courier New', monospace;
            font-size: clamp(14px, 4vw, 16px);
            font-weight: bold;
            padding: 8px 15px;
            border-radius: 3px;
            border: 2px solid #333;
            box-shadow: inset 0px 2px 5px rgba(0,0,0,0.8), 0px 2px 4px rgba(0,0,0,0.5);
            text-align: center;
            min-width: 60px;
        }

        /* Improved Bottom Historical Note */
        .historical-note {
            color: #ecf0f1; 
            font-family: 'Georgia', serif;
            font-size: clamp(13px, 4vw, 16px);
            font-style: italic;
            margin-top: 30px;
            text-align: center;
            max-width: 90%;
            letter-spacing: 1px;
            line-height: 1.4;
        }

        /* Developer Credit styling */
        .developer-credit {
            color: #9ba3a9;
            font-family: 'Arial', sans-serif;
            font-size: clamp(9px, 3vw, 12px);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 15px;
            text-align: center;
            max-width: 90%;
        }

    </style>
</head>
<body>

    <div class="experiment-title">
        Paired Association Learning with Memory Drum
    </div>

    <div class="wooden-base">
        <div class="drum-housing">
            
            <div class="slanted-front">
                <div class="hinge-bar"></div>
                
                <div class="aperture-window">
                    <div class="paper-strip">
                        <!-- Left: Nonsense Syllable (Stimulus) -->
                        <div class="syllable-slot" id="leftText">READY</div>
                        <div class="divider"></div>
                        <!-- Right: Sensical Word (Response) -->
                        <div class="syllable-slot" id="rightText">READY</div>
                    </div>
                    
                    <!-- The 6 Mechanical Flaps -->
                    <div class="flaps-container">
                        <div class="flap left-flap closed"></div>
                        <div class="flap left-flap closed"></div>
                        <div class="flap left-flap closed"></div>
                        <div class="flap right-flap closed"></div>
                        <div class="flap right-flap closed"></div>
                        <div class="flap right-flap closed"></div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button onclick="startLearning()">1. Learning Phase (All Up)</button>
                <button onclick="startRecall()">2. Recall Phase (Right Closed)</button>
                <button onclick="stopDrum()" style="flex: 1 1 100%;">Stop / Reset</button>
            </div>
            
            <div class="footer-panel">
                <!-- Timer -->
                <div class="led-display" id="timerText">0.0s</div>
            </div>

        </div>
    </div>

    <div class="historical-note">
        First pioneered by American psychologist and philosopher Mary Whiton Calkins in 1894.
    </div>
    
    <div class="developer-credit">
        Website maintained and developed by Sarah Qureshi
    </div>

    <script>
        const originalPairs = [
            ["ZEK", "Apple"],
            ["TOR", "Clock"],
            ["RIM", "Table"],
            ["FUG", "Book"],
            ["LEP", "Tree"],
            ["DAX", "Dog"],
            ["VEK", "Lamp"],
            ["MIP", "River"],
            ["JOR", "Pen"],
            ["TUS", "Star"]
        ];

        let currentPairs = [...originalPairs];
        let currentIndex = 0;
        
        let drumTimeout = null;
        let animationFrame = null;
        
        const exposureTimeMs = 2000; 
        const pauseTimeMs = 500;     
        
        let mode = "stop"; 
        let phase = "idle"; 
        let startTime = 0;

        const leftText = document.getElementById("leftText");
        const rightText = document.getElementById("rightText");
        const timerText = document.getElementById("timerText");
        const leftFlaps = document.querySelectorAll('.left-flap');
        const rightFlaps = document.querySelectorAll('.right-flap');

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function setFlaps(leftOpen, rightOpen) {
            leftFlaps.forEach(flap => flap.className = leftOpen ? "flap left-flap open" : "flap left-flap closed");
            rightFlaps.forEach(flap => flap.className = rightOpen ? "flap right-flap open" : "flap right-flap closed");
        }

        function updateTimer() {
            if (mode === "stop") return;
            
            let elapsed = performance.now() - startTime;
            let currentLimit = phase === "exposing" ? exposureTimeMs : pauseTimeMs;
            
            if (elapsed > currentLimit) elapsed = currentLimit;
            
            if (phase === "exposing") {
                timerText.innerText = (elapsed / 1000).toFixed(1) + "s";
                timerText.style.color = "#ff3333"; 
            } else if (phase === "pausing") {
                timerText.innerText = "WAIT";
                timerText.style.color = "#f39c12"; 
            }
            
            if (elapsed < currentLimit) {
                animationFrame = requestAnimationFrame(updateTimer);
            }
        }

        function stepDrum() {
            if (mode === "stop") return;

            if (phase === "pausing" || phase === "idle") {
                if (currentIndex >= currentPairs.length) {
                    stopDrum();
                    leftText.innerText = "END";
                    rightText.innerText = "END";
                    return;
                }

                phase = "exposing";
                leftText.innerText = currentPairs[currentIndex][0];
                rightText.innerText = currentPairs[currentIndex][1];

                if (mode === "learning") {
                    setFlaps(true, true);
                } else if (mode === "recall") {
                    setFlaps(true, false); 
                }

                startTime = performance.now();
                cancelAnimationFrame(animationFrame);
                animationFrame = requestAnimationFrame(updateTimer);

                drumTimeout = setTimeout(stepDrum, exposureTimeMs);

            } else if (phase === "exposing") {
                phase = "pausing";
                setFlaps(false, false); 
                
                startTime = performance.now();
                cancelAnimationFrame(animationFrame);
                animationFrame = requestAnimationFrame(updateTimer);

                currentIndex++;
                drumTimeout = setTimeout(stepDrum, pauseTimeMs);
            }
        }

        function startLearning() {
            stopDrum();
            mode = "learning";
            phase = "idle";
            currentIndex = 0;
            shuffleArray(currentPairs); 
            stepDrum();
        }

        function startRecall() {
            stopDrum();
            mode = "recall";
            phase = "idle";
            currentIndex = 0;
            shuffleArray(currentPairs); 
            stepDrum();
        }

        function stopDrum() {
            mode = "stop";
            phase = "idle";
            clearTimeout(drumTimeout);
            cancelAnimationFrame(animationFrame);
            timerText.innerText = "0.0s";
            timerText.style.color = "#ff3333";
            leftText.innerText = "READY";
            rightText.innerText = "READY";
            setFlaps(false, false); 
        }
    </script>
</body>
</html>
